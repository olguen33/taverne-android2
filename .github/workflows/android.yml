name: Android unsigned release
on:
  workflow_dispatch:
  push:
    branches: [main, build-v0-32-inventory, fix-v034-campaign, fix-v034-dice, feature-archetypes-v035]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK version against source
        run: |
          expected=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          actual=$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging app/build/outputs/apk/release/app-release-unsigned.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          test -n "$expected" && test "$actual" = "$expected"
      - run: $ANDROID_HOME/build-tools/36.0.0/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: taverne-android-unsigned
          path: app-release-aligned.apk
