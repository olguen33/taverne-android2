name: Verify shared game schema
on:
  push:
    branches: [feature-shared-backend]
    paths: ['supabase/**', '.github/workflows/supabase-schema.yml']
  workflow_dispatch:
jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0001_shared_game.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0002_online_game.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0003_online_writes.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0004_manual_gold.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0005_query_indexes.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0006_rumour_edit.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/shared_game.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/online_game.sql
